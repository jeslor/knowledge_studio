<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Django App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    /* Injects Tailwind utility styles safely straight into Django's auto-generated input boxes */
    form input[type="text"],
    form input[type="email"],
    form input[type="password"] {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        border: 1px solid #d1d5db; /* border-gray-300 */
        background-color: #ffffff;
        font-size: 0.875rem; /* text-sm */
        transition: all 0.15s ease-in-out;
    }
    form input:focus {
        outline: 2px solid transparent;
        outline-offset: 2px;
        border-color: #6366f1; /* border-indigo-500 */
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); /* ring-indigo-500/15 */
    }
</style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
        <a href="/" class="font-bold text-xl text-indigo-600 tracking-tight">RAG Studio</a>
        <nav class="flex items-center space-x-6 text-sm font-medium text-gray-600">
            <a href="/" class="hover:text-indigo-600 transition">Home</a>

            {% if user.is_authenticated %}
                <!-- Shown ONLY when logged in: User Badge & Logout -->
                <a href="{% url 'redirect_to_own_profile' %}" class="flex items-center space-x-2 text-gray-700 hover:text-indigo-600 transition group">
                    <!-- Clean SVG User Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-gray-400 group-hover:text-indigo-600 transition">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                    <span>
                        {% if user.first_name %}
                            {{ user.first_name }}
                        {% else %}
                            {{ user.username }}
                        {% endif %}
                    </span>
                </a>

                <!-- Make sure your logout URL pattern name matches this -->
                <a href="{% url 'logout' %}" class="hover:text-red-600 transition font-semibold">Logout</a>
            {% else %}
                <!-- Shown ONLY when logged out: Login & Register -->
                <a href="/login/" class="hover:text-indigo-600 transition">Login</a>
                <a href="/register/" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">Register</a>
            {% endif %}
        </nav>
    </div>
</header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
        {% block content %}
        {% endblock content %}
    </main>

    <footer class="bg-white border-t border-gray-100 py-4 text-center text-xs text-gray-400">
        &copy; 2026 Your Project. Built with Django & Tailwind.
    </footer>

</body>
</html>
