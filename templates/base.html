<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RAG Studio{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        body { background-color: #0b0f19; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        iconify-icon { display: inline; }
        form input[type="text"],
        form input[type="email"],
        form input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid #d1d5db; /* border-gray-300 */
            background-color: #ffffff;
            font-size: 0.875rem; /* text-sm */
            transition: all 0.15s ease-in-out;
            color:#020617;
            font-weight:500;
        }
        form input:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            border-color: #6366f1; /* border-indigo-500 */
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); /* ring-indigo-500/15 */
        }
    </style>
</head>
<body class="bg-gray-90 text-gray-200 antialiased h-screen ">

    <div class="flex h-full">
         <aside class="w-64 h-full bg-slate-950 border-r border-slate-900 p-4 flex flex-col justify-between flex-shrink-0 fixed">
            <div class="w-full flex flex-col gap-4">
                <div>
                  <a href="/" class="flex items-center space-x-2 text-emerald-500 font-bold">
                      <iconify-icon class="text-[32px]" icon="cbi:ai"></iconify-icon>
                    <span>RAG Studio</span>
                  </a>
                </div>
               <div class="h-px bg-slate-900 w-full -mt-[7px]"></div>
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 px-2">Recent Activity</span>

                <div id="history-container" class="w-full flex flex-col gap-1 overflow-y-auto custom-scroll max-h-[70vh]">
                </div>
            </div>
            <footer>
              <div class="h-fit flex flex-col gap-y-4 pb-5 text-[14px] text-gray-400">
               {% if user.is_authenticated %}
                <!-- Shown ONLY when logged in: User Badge & Logout -->
                <a href="{% url 'redirect_to_own_profile' %}" class="flex items-center space-x-2  transition hover:text-gray-100">
                    <!-- Clean SVG User Icon -->
                   <iconify-icon class="text-[28px]" icon="ei:user"></iconify-icon>
                    <span>
                        {% if user.first_name %}
                            {{ user.first_name }}
                        {% else %}
                            {{ user.username }}
                        {% endif %}
                    </span>
                </a>

                <!-- Make sure your logout URL pattern name matches this -->
                <a href="{% url 'logout' %}" class="hover:text-red-600 transition font-semibold flex items-center flex items-center space-x-2 "><iconify-icon class="text-[28px]" icon="ei:lock"></iconify-icon> <span>Logout</span></a>
            {% else %}
                <!-- Shown ONLY when logged out: Login & Register -->
                <a href="/login/" class="flex items-center space-x-2  transition hover:text-gray-100"><iconify-icon class="text-[28px]" icon="ei:unlock"></iconify-icon> <span>Login</span></a>
            {% endif %}
            </div>
            <div class="text-center text-xs text-slate-600 w-full">v1.2.0 • Built by Jeslor</div>
            </footer>
        </aside>

      <main class=" w-[calc(100vw-264px)] ml-auto flex justify-center align-center overflow-y-scroll">
          {% block content %}
          {% endblock content %}
      </main>

    </div>

    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

    <script>
        const queryInput = document.getElementById('query-input');
        const sendBtn = document.getElementById('send-btn');
        const chatContainer = document.getElementById('chat-container');
        const emptyState = document.getElementById('empty-state');
        const historyContainer = document.getElementById('history-container');

        // Handle Send actions
        sendBtn.addEventListener('click', executePipeline);
        queryInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                executePipeline();
            }
        });

        async function fetch(stepData) {
            const response = await fetch('/api/rag/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}' // Built-in Django CSRF security
                },
                body: JSON.stringify(stepData)
            });
            return await response.json();
        }

        async function executePipeline() {
            alert("clicked")
            const query = queryInput.value.trim();
            if (!query) return;
            queryInput.value = '';

            if (emptyState) emptyState.remove();

            // 1. Add Query to Sidebar History
            const histItem = document.createElement('div');
            histItem.className = "w-full flex items-center gap-2 p-2 hover:bg-slate-800 rounded-lg cursor-pointer transition-colors group";
            histItem.innerHTML = `<span class="material-icons text-sm text-slate-500 group-hover:text-slate-300">chat_bubble_outline</span>
                                  <span class="text-sm text-slate-400 group-hover:text-slate-200 truncate">${query.length > 22 ? query.substring(0,22)+'...' : query}</span>`;
            historyContainer.appendChild(histItem);

            // 2. Insert User Query Card in Chat Window
            const userCard = document.createElement('div');
            userCard.className = "w-full bg-slate-800 border border-slate-700/50 p-4 rounded-xl shadow-md";
            userCard.innerHTML = `<div class="flex items-center gap-2 text-slate-400 text-xs font-semibold uppercase mb-1"><span class="material-icons text-xs">person</span>You</div>
                                  <div class="text-base text-slate-100">${query}</div>`;
            chatContainer.appendChild(userCard);

            // 3. Insert Empty AI Status Block Card
            const aiCard = document.createElement('div');
            aiCard.className = "w-full bg-slate-900 border border-slate-800 p-5 rounded-xl shadow-lg";
            aiCard.innerHTML = `
                <div class="flex items-center gap-2 text-emerald-400 text-xs font-semibold uppercase mb-3"><span class="material-icons text-xs">smart_toy</span>Assistant</div>
                <div id="status-box" class="flex items-center gap-3 bg-slate-850 p-3 rounded-lg border border-slate-800 w-full text-slate-300 text-sm transition-all duration-300">
                    <div class="animate-spin rounded-full h-4 w-4 border-2 border-emerald-500 border-t-transparent"></div>
                    <span id="status-text">Analyzing and processing query...</span>
                </div>
                <div id="ai-response-content" class="text-slate-200 leading-relaxed w-full mt-4 border-t border-slate-800 pt-4 hidden"></div>`;
            chatContainer.appendChild(aiCard);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const statusBox = aiCard.querySelector('#status-box');
            const statusText = aiCard.querySelector('#status-text');
            const responseContent = aiCard.querySelector('#ai-response-content');

            // --- SEQUENTIAL PIPELINE STEPPING OVER API ---
            try {
                // Step 1: Process
                let res = await def_fetch({ query: query, step: 'process' });

                // Step 2: Retrieve
                statusText.innerText = "Searching knowledge base for relevant documents...";
                res = await def_fetch({ query: query, step: 'retrieve', processed_query: res.data });

                // Step 3: Rerank
                statusText.innerText = "Evaluating and reranking document relevance...";
                res = await def_fetch({ query: query, step: 'rerank', retrieved_docs: res.data });

                // Step 4: Context
                statusText.innerText = "Building optimized context payload...";
                res = await def_fetch({ query: query, step: 'context', ranked_docs: res.data });

                // Step 5: Generation
                statusText.innerText = "Synthesizing final response...";
                res = await def_fetch({ query: query, step: 'generate', context: res.context });

                // Finished Successfully
                statusBox.className = "flex items-center gap-3 bg-emerald-950/30 border border-emerald-900/50 text-emerald-300 p-3 rounded-lg text-sm";
                statusBox.innerHTML = `<span class="material-icons text-sm text-emerald-400">check_circle</span> Pipeline completed successfully`;

                // Show Answer
                responseContent.classList.remove('hidden');
                responseContent.innerText = res.answer;

            } catch (err) {
                statusBox.className = "flex items-center gap-3 bg-red-950/30 border border-red-900/50 text-red-300 p-3 rounded-lg text-sm";
                statusText.innerText = "Pipeline error occurred.";
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>

</body>
</html>
